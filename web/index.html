<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Driftless Cast — trout fishing forecast for the Driftless Area</title>
  <meta name="description" content="Should you go fishing today? Hour-by-hour trout forecasts for Driftless Area streams in Minnesota, Wisconsin and Iowa — hatches, water, weather, season rules, and what to tie on." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="Driftless Cast" />
  <meta property="og:description" content="Trout fishing forecast for the Driftless Area — when, where and how to fish, and when to skip." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icons/og.png" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map" role="region" aria-label="Map of Driftless trout streams"></div>

  <div id="scrubber" class="scrubber scrubber-empty" aria-label="Forecast time">
    <button id="scrub-now" type="button" title="Jump to now">Now</button>
    <input id="scrub-slider" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Forecast hour" />
    <span id="scrub-label" class="scrub-label">…</span>
  </div>
  <div class="map-key" aria-hidden="true">
    <span><i class="k-go"></i>Go</span><span><i class="k-good"></i>Worth it</span><span><i class="k-slow"></i>Slow</span><span><i class="k-skip"></i>Skip</span><span><i class="k-closed"></i>Closed</span>
  </div>

  <button id="sidebar-toggle" type="button" aria-label="Show panel" aria-expanded="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <aside id="sidebar" aria-label="Forecast panel">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#123c33" />
          <path d="M5 22.5c3.5-8.5 11-12.5 20.5-10" fill="none" stroke="#7fd6b8" stroke-width="2.2" stroke-linecap="round" />
          <path d="M5 25.5c5.5 2.2 12 1.8 20-2.5" fill="none" stroke="#3dbb98" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
          <circle cx="25.6" cy="12.4" r="2.3" fill="#f2c14e" />
        </svg>
        <h1>Driftless Cast</h1>
        <span id="summary" class="sr-only"></span>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="stream-search" type="search" placeholder="Search streams or towns" autocomplete="off" aria-label="Search streams" />
      </label>
      <nav class="tab-bar" aria-label="Sections">
        <button class="tab tab-active" data-view="windows">Today</button>
        <button class="tab" data-view="calendar">Hatches</button>
        <button class="tab" data-view="reports">Journal</button>
        <button class="tab" data-view="learn">Learn</button>
      </nav>
    </header>

    <div class="panel-body">
      <section id="best-windows" class="home">
        <div id="today-summary" class="today"></div>
        <section id="near-me" class="near-panel">
          <button id="near-me-btn" type="button" class="btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            Find streams near me
          </button>
          <p id="near-status" class="muted small hidden"></p>
          <ol id="near-list" class="rows near-list"></ol>
        </section>
        <div class="group">
          <h2 class="group-title">Best bets <span class="group-sub">next 3 days</span></h2>
          <ol id="windows-list" class="rows"><li class="row-skel"></li><li class="row-skel"></li></ol>
        </div>
        <div class="group" id="hatch-watch-group">
          <h2 class="group-title">Hatch watch</h2>
          <ol id="hatch-watch-list" class="rows"></ol>
        </div>
        <div class="group">
          <h2 class="group-title">All streams <span class="group-sub" id="all-count"></span></h2>
          <div id="all-streams"></div>
        </div>
        <section id="planning-summary" class="freshline"></section>
      </section>
      <section id="calendar" class="hidden">
        <h2 class="page-title">Hatch calendar</h2>
        <div id="calendar-body"><p class="muted">loading…</p></div>
      </section>
      <section id="reports" class="hidden">
        <h2 class="page-title">Your journal</h2>
        <div id="reports-body"><p class="muted">loading…</p></div>
      </section>
      <section id="learn" class="hidden">
        <h2 class="page-title">How it works</h2>
        <div id="learn-body"><p class="muted">loading…</p></div>
      </section>
      <section id="page" class="hidden">
        <button type="button" class="back-link" data-view-link="windows">← Back</button>
        <div id="page-body"></div>
      </section>
      <section id="detail" class="hidden">
        <button id="close-detail" type="button" class="back-link" aria-label="Back to all streams">← All streams</button>
        <div id="detail-body"></div>
      </section>
      <footer class="app-footer">
        <a href="#/page/about">About</a>
        <a href="#/page/data">Data</a>
        <a href="#/page/privacy">Privacy</a>
        <span>Forecasts are guidance — check current regulations.</span>
      </footer>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="map.js"></script>
</body>
</html>
